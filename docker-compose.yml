services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db-api
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgres/data

  api:
    build: .
    container_name: nest-cep-api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
volumes:
  pgdata: